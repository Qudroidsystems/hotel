# /etc/nginx/sites-available/hotel — replace <domain>, then:
#   sudo ln -s /etc/nginx/sites-available/hotel /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <domain>      (adds HTTPS and the redirect from http)
server {
    listen 80;
    listen [::]:80;
    server_name <domain>;
    root /var/www/hotel/public;
    index index.php;

    client_max_body_size 12M;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Live updates (guest chat, calls): the apps' and browsers' sockets go to the real-time server
    # (deploy/hotel-reverb.service). Harmless while it isn't installed.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Room calendars (/ical/<token>.ics) are answered by the app, not as files.
    location ~ ^/ical/ {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# /etc/turnserver.conf — coturn, the relay for guest voice calls when two phones can't reach each other directly
# (most mobile networks). Install:  sudo apt install coturn  (server-setup.sh asks), then replace <...> below,
#   sudo cp deploy/turnserver.conf /etc/turnserver.conf && sudo systemctl enable --now coturn
# and in the hotel's .env (or Hotel Settings → Live Chat & Calls):
#   WEBRTC_TURN_URLS="turn:<domain>:3478,turns:<domain>:5349"
#   WEBRTC_TURN_SECRET=<the same secret as static-auth-secret>
# Open the firewall: 3478 tcp+udp, 5349 tcp, and 49152-65535 udp (the relayed voice).

listening-port=3478
tls-listening-port=5349
realm=<domain>
server-name=<domain>

# Time-limited logins made by the hotel system for each call (no fixed passwords to leak).
use-auth-secret
static-auth-secret=<a long random secret, e.g. from: openssl rand -hex 32>

# The certificate Certbot made for the website.
cert=/etc/letsencrypt/live/<domain>/fullchain.pem
pkey=/etc/letsencrypt/live/<domain>/privkey.pem

# The server's public IP when it sits behind NAT (most cloud servers): external-ip=<public ip>/<private ip>
# external-ip=<public ip>

min-port=49152
max-port=65535
fingerprint
no-cli
no-multicast-peers
# Never relay into the server's own private networks.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
total-quota=200
stale-nonce=600
log-file=/var/log/turnserver.log
simple-log
